name: nexus-qa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_ai:
        description: Run the real OpenAI self-healing demo
        required: false
        type: boolean
        default: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: qashop
      DB_USER: qashop
      DB_PASSWORD: qashop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API and database
        run: docker compose up -d --wait

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: npx playwright test

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/docker-service-logs.txt" 2>&1 || true

      - name: Stop API and database
        if: always()
        run: docker compose down -v

      - name: Upload Docker service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-service-logs
          path: ${{ runner.temp }}/docker-service-logs.txt
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  ai-live:
    name: Live OpenAI self-healing demo
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_live_ai)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check OpenAI secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run real self-healing test
        run: >-
          npx playwright test tests/ai/self-healing.spec.ts
          --project=ai
          --grep "recovers from an incorrect locator using real OpenAI"

      - name: Upload live AI Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-self-healing-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
