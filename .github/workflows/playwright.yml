name: nexus-qa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: qashop
      DB_USER: qashop
      DB_PASSWORD: qashop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API and database
        run: docker compose up -d --wait

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: npx playwright test

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/docker-service-logs.txt" 2>&1 || true

      - name: Stop API and database
        if: always()
        run: docker compose down -v

      - name: Upload Docker service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-service-logs
          path: ${{ runner.temp }}/docker-service-logs.txt
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
